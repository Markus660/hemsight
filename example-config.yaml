# ---------------------------------------------------------------------------
# The single runtime configuration
# ---------------------------------------------------------------------------
# At runtime there is EXACTLY ONE configuration source: data/config.yaml (in the Home
# Assistant app /data/config.yaml). It is created by the one-off boot migration or by
# the setup wizard, and in addition to the sections above it holds the blocks that used
# to live in the database. Secrets are NEVER in the config.yaml — they sit Fernet-
# encrypted in data/secrets.yaml (key: the HEMSIGHT_SECRET_KEY environment variable, or
# data/.secret.key).
#
# integrations:                      # direct and cloud integrations (without secrets)
#   shelly_direct:
#     enabled: false
#     devices_json: "[]"             # device list as a JSON string
# auth:                              # UI login (PBKDF2 hash material, not reversible)
#   ui_basic_auth_enabled: true
#   ui_basic_auth_user: admin
#   ui_basic_auth_password_hash: "<hash>"
#   ui_basic_auth_password_salt: "<salt>"
#   ui_basic_auth_password_iterations: 600000
# connection:                        # Home Assistant connection (token -> secrets.yaml!)
#   ha_url: "http://homeassistant.local:8123"
# intent:                            # user intent profile (cost | self_consumption | profit)
#   profile: cost
# notifications:                     # notifications (webhook.url/apprise.urls -> secrets.yaml)
#   enabled: false
#   min_severity: warning
