name: HEMSight
version: "0.0.2-beta"
slug: hemsight
description: Home energy management and live optimization for Home Assistant
url: https://hemsight.de
arch:
  - aarch64
  - amd64
startup: application
stage: experimental
boot: manual
init: false
backup: hot
# Gives the app the SUPERVISOR_TOKEN and access to the Core API. HEMSight connects to your
# Home Assistant on its own with it, so the setup asks you for neither an address nor a
# token.
homeassistant_api: true
hassio_api: true
image: ghcr.io/markus660/hemsight-addon
# HEMSight shows up inside the Home Assistant interface, behind your HA login. No extra
# port, no second password: HA signs you in and proxies to the app internally.
ingress: true
ingress_port: 8099
# Without this there is no HEMSight entry in the sidebar and you have to open the add-on page
# every time.
ingress_panel: true
panel_icon: mdi:home-lightning-bolt
options:
  log_level: info
  access_log: true
schema:
  log_level: "list(critical|error|warning|info|debug)"
  access_log: bool
